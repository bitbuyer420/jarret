<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Merchant Frontier compass patch">
  <!-- COMPASS PATCH — a woven compass-star badge.
       Thread colors: Ink #1E1B17, Clay #AC4E38, Ivory #FBF8F2. Merrow-edge border. -->
  <defs>
    <path id="mf-comp-top" d="M 50 150 A 100 100 0 0 1 250 150" />
    <path id="mf-comp-bottom" d="M 60 150 A 90 90 0 0 0 240 150" />
  </defs>

  <!-- merrow border + field -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#AC4E38" stroke-width="8" />
  <circle cx="150" cy="150" r="132" fill="#FBF8F2" stroke="#1E1B17" stroke-width="4" />
  <circle cx="150" cy="150" r="112" fill="none" stroke="#1E1B17" stroke-width="1.5" />

  <!-- diagonal short rays -->
  <g fill="#1E1B17" opacity="0.85">
    <path d="M150 150 L196 104 L172 128 Z" />
    <path d="M150 150 L104 104 L128 128 Z" />
    <path d="M150 150 L196 196 L172 172 Z" />
    <path d="M150 150 L104 196 L128 172 Z" />
  </g>
  <!-- cardinal compass star (4 long points) -->
  <path d="M150 62 L164 136 L238 150 L164 164 L150 238 L136 164 L62 150 L136 136 Z" fill="#1E1B17" />
  <!-- inner hub -->
  <circle cx="150" cy="150" r="12" fill="#AC4E38" />
  <circle cx="150" cy="150" r="4" fill="#FBF8F2" />

  <!-- arced lettering -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#1E1B17">
    <textPath href="#mf-comp-top" startOffset="50%" text-anchor="middle" font-size="20" letter-spacing="3">MERCHANT&#160;FRONTIER</textPath>
  </text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#1E1B17">
    <textPath href="#mf-comp-bottom" startOffset="50%" text-anchor="middle" font-size="15" letter-spacing="5">★ TRUE&#160;NORTH ★</textPath>
  </text>
</svg>
