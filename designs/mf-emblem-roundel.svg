<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Merchant Frontier emblem crest">
  <!-- FLAGSHIP EMBLEM — the frontier crest.
       Thread colors: Ink #1E1B17, Clay #AC4E38, Ivory #FBF8F2 (backing). -->
  <defs>
    <path id="mf-arc-top" d="M 44 150 A 106 106 0 0 1 256 150" />
    <path id="mf-arc-bottom" d="M 54 150 A 96 96 0 0 0 246 150" />
  </defs>

  <!-- rings -->
  <circle cx="150" cy="150" r="140" fill="#FBF8F2" stroke="#1E1B17" stroke-width="5" />
  <circle cx="150" cy="150" r="120" fill="none" stroke="#1E1B17" stroke-width="2" />

  <!-- arced lettering -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#1E1B17">
    <textPath href="#mf-arc-top" startOffset="50%" text-anchor="middle" font-size="24" letter-spacing="3">MERCHANT&#160;FRONTIER</textPath>
  </text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#1E1B17">
    <textPath href="#mf-arc-bottom" startOffset="50%" text-anchor="middle" font-size="15" letter-spacing="4">★ EST&#160;2026 ★ PORTLAND ★</textPath>
  </text>

  <!-- center scene: sun rising over the frontier -->
  <g>
    <!-- rays -->
    <g stroke="#1E1B17" stroke-width="4" stroke-linecap="round">
      <path d="M150 128 V116" />
      <path d="M176 136 L184 127" />
      <path d="M124 136 L116 127" />
    </g>
    <!-- sun -->
    <path d="M110 178 A40 40 0 0 1 190 178 Z" fill="#AC4E38" />
    <!-- peaks -->
    <path d="M104 178 L132 146 L160 178 Z" fill="#1E1B17" />
    <path d="M144 178 L178 138 L212 178 Z" fill="#1E1B17" />
    <!-- ground line -->
    <path d="M78 178 H222" stroke="#1E1B17" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
