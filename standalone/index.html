<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merchant Frontier — Snapback Caps</title>
<meta name="description" content="Merchant Frontier makes one thing — a great snapback — stitched with the animals of the range: buffalo, elk, and longhorn.">
</head>
<body>
<style>
  :root {
    --paper: #F3EFE6;
    --cloud: #FBF8F2;
    --ink: #1E1B17;
    --ink-80: rgba(30, 27, 23, 0.82);
    --ink-60: rgba(30, 27, 23, 0.6);
    --stone: #857B6E;
    --clay: #AC4E38;
    --clay-dark: #8F3E2C;
    --sage: #7C8C6C;
    --line: rgba(30, 27, 23, 0.12);
    --line-soft: rgba(30, 27, 23, 0.07);
    --radius: 14px;
    --serif: Georgia, "Iowan Old Style", Cambria, "Times New Roman", serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  img, svg { display: block; max-width: 100%; }

  ::selection { background: var(--clay); color: var(--cloud); }

  :focus-visible {
    outline: 2px solid var(--clay);
    outline-offset: 2px;
    border-radius: 3px;
  }

  .wrap {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px;
  }

  h1, h2, h3 { font-family: var(--serif); font-weight: 500; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }

  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--clay);
    margin: 0;
  }

  .muted { color: var(--stone); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: 999px;
    padding: 13px 26px;
    font-size: 14px; font-weight: 500; letter-spacing: 0.02em;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .1s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--ink); color: var(--cloud); }
  .btn-primary:hover { background: var(--clay); }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn-secondary:hover { background: var(--ink); color: var(--cloud); border-color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--cloud); border: 1px solid rgba(251,248,242,.35); }
  .btn-ghost:hover { background: var(--cloud); color: var(--ink); }
  .btn-block { width: 100%; }

  .ul-link { position: relative; }
  .ul-link::after {
    content: ""; position: absolute; left: 0; bottom: -3px; height: 1px; width: 0; background: currentColor; transition: width .3s ease;
  }
  .ul-link:hover::after { width: 100%; }

  /* Announcement */
  #announcement {
    background: var(--ink); color: var(--cloud);
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
  }
  #announcement .wrap { display: flex; justify-content: center; gap: 34px; height: 36px; align-items: center; }
  #announcement span:not(:first-child) { display: none; }
  @media (min-width: 640px) { #announcement span:not(:first-child) { display: inline; } }

  /* Header */
  #site-header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(243,239,230,.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  #site-header .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 66px; }
  .logo { font-family: var(--sans); font-weight: 600; font-size: clamp(13px, 3.4vw, 18px); letter-spacing: 0.16em; white-space: nowrap; }
  .nav { display: none; gap: 28px; }
  @media (min-width: 900px) { .nav { display: flex; } .menu-toggle { display: none; } }
  .nav a { font-size: 14px; color: var(--ink-80); }
  .nav a.active { color: var(--clay); }
  .header-actions { display: flex; align-items: center; gap: 18px; }
  .icon-btn { background: none; border: none; padding: 0; color: var(--ink); display: inline-flex; position: relative; }
  .cart-count {
    position: absolute; top: -8px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px;
    background: var(--clay); color: var(--cloud); border-radius: 999px;
    font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .menu-toggle { background: none; border: none; color: var(--ink); padding: 0; }
  #mobile-nav { display: none; border-top: 1px solid var(--line); background: var(--paper); }
  #mobile-nav.open { display: block; }
  #mobile-nav a { display: block; padding: 13px 0; font-size: 15px; border-bottom: 1px solid var(--line-soft); }

  /* View animation */
  #app { animation: fade-up .45s ease both; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    #app, .prod-media img, .prod-media > div { animation: none !important; transition: none !important; }
    * { scroll-behavior: auto !important; }
  }

  /* Hero */
  .hero { background: var(--cloud); border-bottom: 1px solid var(--line); }
  .hero .grid { display: grid; gap: 40px; align-items: center; padding: 60px 0; }
  @media (min-width: 820px) { .hero .grid { grid-template-columns: 1fr 1fr; padding: 96px 0; } }
  .hero h1 { font-size: clamp(38px, 6vw, 64px); line-height: 1.03; margin-top: 14px; }
  .hero p.lead { max-width: 30rem; color: var(--stone); margin: 22px 0 0; font-size: 17px; }
  .hero-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .hero-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hero-tiles a:nth-child(2) { margin-top: 34px; }
  .tile { overflow: hidden; border-radius: 18px; }
  .tile .media { aspect-ratio: 3/4; transition: transform .5s ease; }
  .tile:hover .media { transform: scale(1.05); }

  /* Value props */
  .values { border-bottom: 1px solid var(--line); }
  .values .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; padding: 30px 0; text-align: center; }
  @media (min-width: 760px) { .values .grid { grid-template-columns: repeat(4, 1fr); } }
  .values b { display: block; font-size: 14px; }
  .values small { color: var(--stone); font-size: 12px; }

  /* Section */
  section.block { padding: 66px 0; }
  section.block.tint { background: var(--cloud); }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 34px; gap: 16px; }
  .sec-head h2 { font-size: 30px; margin-top: 8px; }

  /* Product grid */
  .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 18px; }
  @media (min-width: 680px) { .pgrid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1000px) { .pgrid { grid-template-columns: repeat(4, 1fr); } }
  .card { display: flex; flex-direction: column; }
  .card .prod-media { position: relative; overflow: hidden; border-radius: 12px; }
  .card .media { aspect-ratio: 4/5; transition: transform .5s ease; }
  .card:hover .media { transform: scale(1.03); }
  .badges { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; }
  .badge { border-radius: 999px; padding: 4px 10px; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--cloud); }
  .badge.best { background: var(--ink); }
  .badge.sale { background: var(--clay); }
  .card-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .card-name { font-size: 14px; font-weight: 500; }
  .card:hover .card-name { color: var(--clay); }
  .card-cat { font-size: 12px; color: var(--stone); margin-top: 2px; }
  .price { font-size: 14px; font-weight: 500; }
  .price .was { color: var(--stone); text-decoration: line-through; margin-left: 6px; font-size: 12px; }
  .swatches { display: flex; gap: 6px; margin-top: 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 999px; border: 1px solid var(--line); }

  /* Collections */
  .colls { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 560px) { .colls { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 980px) { .colls { grid-template-columns: repeat(4, 1fr); } }
  .coll-card {
    position: relative; overflow: hidden; border-radius: 18px; aspect-ratio: 4/5;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 22px; color: var(--cloud);
  }
  .coll-card h3 { font-family: var(--sans); font-weight: 600; font-size: 18px; }
  .coll-card small { color: rgba(251,248,242,.8); }
  .coll-card .sheen { position: absolute; inset: 0; opacity: .18; transition: transform .5s ease; background-image: radial-gradient(circle at 30% 18%, #ffffff66, transparent 60%); }
  .coll-card:hover .sheen { transform: scale(1.12); }

  /* Editorial band */
  .band { background: var(--ink); color: var(--cloud); }
  .band .grid { display: grid; gap: 40px; align-items: center; padding: 66px 0; }
  @media (min-width: 820px) { .band .grid { grid-template-columns: 1fr 1fr; padding: 92px 0; } }
  .band .eyebrow { color: var(--clay); }
  .band h2 { font-size: 34px; margin-top: 14px; }
  .band p { color: rgba(251,248,242,.72); max-width: 28rem; margin-top: 18px; }
  .band-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .band-tiles .tile .media { aspect-ratio: 3/4; }

  /* Shop toolbar */
  .toolbar { display: flex; flex-direction: column; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 26px; }
  @media (min-width: 640px) { .toolbar { flex-direction: row; align-items: center; justify-content: space-between; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border-radius: 999px; padding: 7px 15px; font-size: 13px; border: 1px solid var(--line); background: transparent; color: var(--ink-80); transition: all .18s; }
  .chip:hover { border-color: var(--ink); }
  .chip.active { background: var(--ink); color: var(--cloud); border-color: var(--ink); }
  select.sort { border-radius: 999px; border: 1px solid var(--line); background: transparent; padding: 8px 14px; font-size: 13px; color: var(--ink); font-family: inherit; }

  /* Page header */
  .page-head { padding: 52px 0 8px; }
  .page-head h1 { font-size: clamp(32px, 5vw, 46px); margin-top: 10px; }
  .page-head p { color: var(--stone); max-width: 34rem; margin: 14px 0 0; }
  .banner { border-bottom: 1px solid var(--line); }
  .banner .inner { padding: 58px 0; }

  /* Breadcrumb */
  .crumb { font-size: 12px; color: var(--stone); padding: 12px 0 4px; }
  .crumb a:hover { color: var(--ink); }
  .crumb .sep { margin: 0 8px; }

  /* Product detail */
  .pdp { display: grid; gap: 40px; padding: 8px 0 20px; }
  @media (min-width: 960px) { .pdp { grid-template-columns: 1fr 1fr; gap: 60px; } }
  .pdp-gallery { display: none; }
  @media (min-width: 960px) { .pdp-gallery { display: block; } }
  .pdp-gallery .main { border-radius: 18px; overflow: hidden; }
  .pdp-gallery .main .media { aspect-ratio: 1/1; }
  .pdp-thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 14px; }
  .pdp-thumbs .tile .media { aspect-ratio: 1/1; }
  .pdp h1 { font-size: clamp(28px, 4vw, 40px); margin-top: 8px; }
  .pdp .tagline { color: var(--stone); margin-top: 8px; }
  .pdp .price-row { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .pdp .price-row .now { font-size: 24px; font-weight: 500; }
  .pdp .price-row .was { font-size: 18px; color: var(--stone); text-decoration: line-through; }
  .save-pill { background: rgba(172,78,56,.12); color: var(--clay); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
  .pdp .desc { margin-top: 22px; color: var(--ink-80); line-height: 1.65; }
  .mobile-media { border-radius: 16px; overflow: hidden; margin-bottom: 8px; }
  .mobile-media .media { aspect-ratio: 1/1; }
  @media (min-width: 960px) { .mobile-media { display: none; } }

  .opt-label { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 500; }
  .opt-label .sel { color: var(--stone); font-weight: 400; }
  .color-opts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .color-dot { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); position: relative; transition: box-shadow .15s; }
  .color-dot.active { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
  .size-opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .size-btn { min-width: 48px; border-radius: 9px; border: 1px solid var(--line); background: transparent; padding: 9px 12px; font-size: 14px; color: var(--ink); transition: all .15s; }
  .size-btn:hover { border-color: var(--ink); }
  .size-btn.active { background: var(--ink); color: var(--cloud); border-color: var(--ink); }
  .size-err { color: var(--clay); font-size: 12px; margin-top: 8px; display: none; }
  .size-err.show { display: block; }
  .buy-row { display: flex; align-items: center; gap: 12px; margin-top: 30px; }
  .qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
  .qty button { background: none; border: none; padding: 12px 16px; font-size: 15px; color: var(--ink); }
  .qty span { min-width: 30px; text-align: center; font-size: 14px; }
  .stock { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--stone); margin-top: 16px; }
  .dot-sage { width: 7px; height: 7px; border-radius: 999px; background: var(--sage); }
  .detail-block { border-top: 1px solid var(--line); margin-top: 38px; padding-top: 30px; display: flex; flex-direction: column; gap: 22px; }
  .detail-block h4 { font-family: var(--sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
  .detail-block ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .detail-block li { display: flex; gap: 10px; font-size: 14px; color: var(--ink-80); }
  .detail-block li::before { content: ""; width: 4px; height: 4px; margin-top: 8px; border-radius: 999px; background: var(--clay); flex: none; }
  .detail-block .perks { display: flex; gap: 24px; font-size: 12px; color: var(--stone); }

  /* Cart page */
  .cart-layout { display: grid; gap: 44px; margin-top: 36px; }
  @media (min-width: 900px) { .cart-layout { grid-template-columns: 1fr 360px; } }
  .cart-lines { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .cart-lines li { display: flex; gap: 18px; padding: 22px 0; border-bottom: 1px solid var(--line-soft); }
  .cart-lines li:last-child { border-bottom: none; }
  .cart-thumb { width: 92px; height: 112px; border-radius: 10px; flex: none; }
  .summary { border: 1px solid var(--line); background: var(--cloud); border-radius: 18px; padding: 24px; height: fit-content; }
  @media (min-width: 900px) { .summary { position: sticky; top: 90px; } }
  .summary h2 { font-family: var(--sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; }
  .sum-row { display: flex; justify-content: space-between; font-size: 14px; margin-top: 12px; }
  .sum-total { display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .empty { min-height: 46vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 60px 0; }
  .empty h1 { font-size: 30px; }

  /* Checkout */
  .checkout-grid { display: grid; gap: 44px; margin-top: 34px; }
  @media (min-width: 960px) { .checkout-grid { grid-template-columns: 1fr 380px; } }
  fieldset { border: none; margin: 0; padding: 0; }
  fieldset + fieldset { margin-top: 34px; }
  fieldset > h3 { font-family: var(--sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; margin-bottom: 16px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label.field { display: block; font-size: 14px; }
  label.field.full { grid-column: 1 / -1; }
  label.field span { display: block; color: var(--stone); margin-bottom: 6px; }
  label.field input { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 11px 13px; font-family: inherit; font-size: 14px; color: var(--ink); }
  label.field input:focus { outline: none; border-color: var(--ink); }
  .demo-note { grid-column: 1 / -1; border: 1px solid var(--line); background: var(--cloud); border-radius: 12px; padding: 15px; }
  .demo-note b { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .demo-note small { color: var(--stone); }
  .co-line { display: flex; gap: 12px; align-items: center; }
  .co-thumb { width: 48px; height: 56px; border-radius: 8px; flex: none; position: relative; }
  .co-badge { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 999px; background: var(--ink); color: var(--cloud); font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  .confirm { min-height: 62vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px 0; }
  .confirm .check { width: 66px; height: 66px; border-radius: 999px; background: rgba(124,140,108,.18); color: var(--sage); display: flex; align-items: center; justify-content: center; }
  .confirm h1 { font-size: 30px; margin-top: 24px; }
  .confirm p { color: var(--stone); max-width: 27rem; margin-top: 12px; }

  /* About */
  .about-values { display: grid; gap: 34px; padding: 62px 0; }
  @media (min-width: 780px) { .about-values { grid-template-columns: repeat(3, 1fr); } }
  .about-values .rule { width: 40px; height: 2px; background: var(--clay); margin-bottom: 16px; }
  .about-values h3 { font-family: var(--sans); font-size: 18px; font-weight: 600; }
  .about-values p { color: var(--stone); margin-top: 12px; }
  .sus-list { display: flex; flex-direction: column; gap: 22px; }
  .sus-list .item { border-top: 1px solid rgba(251,248,242,.16); padding-top: 16px; }
  .sus-list h4 { font-family: var(--sans); font-weight: 500; margin: 0; }
  .sus-list small { color: rgba(251,248,242,.7); }

  /* Cart drawer */
  #overlay { position: fixed; inset: 0; z-index: 50; background: rgba(30,27,23,.42); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
  #overlay.open { opacity: 1; pointer-events: auto; }
  #drawer { position: fixed; top: 0; right: 0; z-index: 51; height: 100%; width: 100%; max-width: 430px; background: var(--paper); box-shadow: -20px 0 50px rgba(0,0,0,.16); transform: translateX(100%); transition: transform .32s ease; display: flex; flex-direction: column; }
  #drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { font-family: var(--sans); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; }
  .close-x { background: none; border: none; font-size: 26px; line-height: 1; color: var(--ink); }
  .ship-meter { padding: 16px 24px; border-bottom: 1px solid var(--line); }
  .ship-meter .track { height: 6px; border-radius: 999px; background: var(--line); margin-top: 8px; overflow: hidden; }
  .ship-meter .fill { height: 100%; background: var(--sage); border-radius: 999px; transition: width .5s ease; }
  .drawer-lines { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0 24px; }
  .drawer-lines li { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
  .drawer-thumb { width: 62px; height: 78px; border-radius: 8px; flex: none; }
  .drawer-foot { border-top: 1px solid var(--line); padding: 20px 24px; }
  .drawer-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 0 24px; }
  .mini-qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; }
  .mini-qty button { background: none; border: none; padding: 4px 10px; font-size: 14px; color: var(--ink); }
  .mini-qty span { min-width: 22px; text-align: center; font-size: 13px; }
  .link-remove { background: none; border: none; font-size: 12px; color: var(--stone); text-decoration: underline; }
  .link-remove:hover { color: var(--clay); }

  /* Footer */
  #site-footer { margin-top: 90px; border-top: 1px solid var(--line); background: var(--cloud); }
  .foot-grid { display: grid; gap: 44px; padding: 60px 0; }
  @media (min-width: 780px) { .foot-grid { grid-template-columns: 1.4fr 1fr 1fr 1.2fr; } }
  .foot-grid h4 { font-family: var(--sans); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; }
  .foot-grid ul { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .foot-grid ul a { font-size: 14px; color: var(--stone); }
  .foot-grid ul a:hover { color: var(--ink); }
  .news { display: flex; max-width: 20rem; margin-top: 14px; }
  .news input { flex: 1; border: 1px solid var(--line); border-right: none; background: transparent; border-radius: 999px 0 0 999px; padding: 10px 15px; font-family: inherit; font-size: 14px; color: var(--ink); }

  /* ----------------------------- Cart ----------------------------- */

      '<div><h4>Stay in the loop</h4><p class="muted" style="margin-top:14px;font-size:14px">Early access to drops and 10% off your first order.</p>' +
      '<form class="news" id="newsForm"><input type="email" placeholder="Email address" required aria-label="Email address"><button type="submit" aria-label="Subscribe">&rarr;</button></form><p class="muted" id="newsMsg" style="font-size:13px;margin-top:10px;display:none;color:var(--sage)">Thanks — check your inbox for a welcome code.</p></div></div>' +
      '<div class="foot-bottom"><div class="wrap"><p>© 2026 Merchant Frontier Cap Co. All rights reserved.</p><div class="links"><a href="#/about">Privacy</a><a href="#/about">Terms</a><a href="#/about">Returns</a></div></div></div>';
    var nf = document.getElementById("newsForm");
    nf.addEventListener("submit", function (e) { e.preventDefault(); nf.style.display = "none"; document.getElementById("newsMsg").style.display = "block"; });
  }

  /* --------------------------- Router ----------------------------- */
  function parseHash() {
    var raw = location.hash.slice(1) || "/";
    var q = "", qi = raw.indexOf("?");
    if (qi > -1) { q = raw.slice(qi + 1); raw = raw.slice(0, qi); }
    return { path: raw, query: q };
  }
  function queryParam(q, key) {
    var parts = q.split("&");
    for (var i = 0; i < parts.length; i++) { var kv = parts[i].split("="); if (kv[0] === key) return decodeURIComponent(kv[1] || ""); }
    return "";
  }

  function render() {
    var r = parseHash(), path = r.path, app = document.getElementById("app"), navCurrent = null, html, after = null;
    var seg = path.split("/").filter(Boolean); // e.g. ["product","handle"]

    if (path === "/" || path === "") { html = viewHome(); }
    else if (seg[0] === "shop") { html = viewShop(); navCurrent = "#/shop"; after = renderShop; }
    else if (seg[0] === "collection" && seg[1]) { html = viewCollection(seg[1]); navCurrent = "#/collection/" + seg[1]; }
    else if (seg[0] === "product" && seg[1]) { var ph = seg[1]; html = viewProduct(ph); after = function () { wireProduct(ph); }; }
    else if (path === "/cart") { html = viewCart(); }
    else if (path === "/checkout") { html = viewCheckout(); after = wireCheckout; }
    else if (path === "/confirmed") { html = viewConfirmed(queryParam(r.query, "id")); }
    else if (path === "/about") { html = viewAbout(); navCurrent = "#/about"; }
    else { html = view404(); }

    closeDrawer();
    app.innerHTML = html;
    renderNav(navCurrent);
    document.getElementById("mobile-nav").classList.remove("open");
    document.getElementById("menuToggle").setAttribute("aria-expanded", "false");
    if (after) after();
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  /* --------------------------- Events ----------------------------- */
  document.getElementById("cartBtn").addEventListener("click", openDrawer);
  overlay.addEventListener("click", closeDrawer);
  document.getElementById("menuToggle").addEventListener("click", function () {
    var mn = document.getElementById("mobile-nav"), open = mn.classList.toggle("open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

  // Delegated events inside the drawer.
  drawer.addEventListener("click", function (e) {
    var t = e.target;
    if (t.closest("[data-close]")) { closeDrawer(); return; }
    var dq = t.getAttribute("data-dq"), iq = t.getAttribute("data-iq"), rm = t.getAttribute("data-rm");
    if (dq) { var l = cart.filter(function (x) { return lineKey(x) === dq; })[0]; if (l) setQty(dq, l.qty - 1); }
    else if (iq) { var l2 = cart.filter(function (x) { return lineKey(x) === iq; })[0]; if (l2) setQty(iq, l2.qty + 1); }
    else if (rm) { removeLine(rm); }
  });

  // Delegated qty/remove on the cart page.
  document.getElementById("app").addEventListener("click", function (e) {
    var t = e.target, dq = t.getAttribute("data-dq"), iq = t.getAttribute("data-iq"), rm = t.getAttribute("data-rm");
    if (dq) { var l = cart.filter(function (x) { return lineKey(x) === dq; })[0]; if (l) setQty(dq, l.qty - 1); }
    else if (iq) { var l2 = cart.filter(function (x) { return lineKey(x) === iq; })[0]; if (l2) setQty(iq, l2.qty + 1); }
    else if (rm) { removeLine(rm); }
  });

  window.addEventListener("hashchange", render);

  /* ----------------------------- Init ----------------------------- */
  renderFooter();
  syncCart();
  render();
})();
</script>
</body>
</html>
